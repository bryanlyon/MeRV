name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load the permanent signing key from repo secrets
        env:
          KS_B64: ${{ secrets.MERV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/merv.keystore"
            echo "MERV_KEYSTORE=$RUNNER_TEMP/merv.keystore" >> "$GITHUB_ENV"
            echo "Signing with the permanent key."
          else
            echo "::warning::Signing secrets not set; this build uses a one-off key."
          fi

      - name: Build debug APK
        env:
          MERV_KEYSTORE_PASSWORD: ${{ secrets.MERV_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleDebug

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/merv.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: merv-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MeRV.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MeRV.apk \
            --title "MeRV build ${GITHUB_SHA::7}" \
            --notes "Built from ${GITHUB_SHA}. Install MeRV.apk on the phone."
